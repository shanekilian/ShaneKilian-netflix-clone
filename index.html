<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>
      Netflix South Africa - Watch TV Shows Online. Watch Movies Online.
    </title>
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <img
          id="netflix-logo"
          src="./resources/netflix-logo.svg"
          alt="netflix-logo"
        />
        <button class="s-btn">Sign In</button>
      </nav>

      <div class="banner">
        <div class="banner-top">
          <h1>Unlimited movies, TV shows, and more</h1>
          <p>Starts at R 59. Cancel anytime</p>
        </div>
        <h3>
          Ready to watch? Enter your email to create or restart your membership.
        </h3>

        <div class="input-get-started">
          <input id="email-text" type="email" placeholder="Email address" />
          <button class="get-started-btn">Get Started</button>
        </div>
      </div>
    </header>
  </body>
</html>
