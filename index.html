<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>
      Netflix South Africa - Watch TV Shows Online. Watch Movies Online.
    </title>
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <img
          id="netflix-logo"
          src="./resources/netflix-logo.svg"
          alt="netflix-logo"
        />
        <button class="s-btn">Sign In</button>
      </nav>

      <div class="banner">
        <div class="banner-top">
          <h1>Unlimited movies, TV shows, and more</h1>
          <p>Starts at R 59. Cancel anytime</p>
        </div>
        <h3>
          Ready to watch? Enter your email to create or restart your membership.
        </h3>

        <div class="input-get-started">
          <input id="email-text" type="email" placeholder="Email address" />
          <button class="get-started-btn">Get Started</button>
        </div>
      </div>
    </header>

    <main>
      <h2>Trending Now</h2>
      <section class="trending">
        <div id="show1" class="card">
          <span>1</span>
        </div>

        <div id="show2" class="card">
          <span>2</span>
        </div>

        <div id="show3" class="card">
          <span>3</span>
        </div>

        <div id="show4" class="card">
          <span>4</span>
        </div>

        <div id="show5" class="card">
          <span>5</span>
        </div>

        <div id="show6" class="card">
          <span>6</span>
        </div>

        <div id="show7" class="card">
          <span>7</span>
        </div>

        <div id="show8" class="card">
          <span>8</span>
        </div>

        <div id="show9" class="card">
          <span>9</span>
        </div>

        <div id="show10" class="card">
          <span>10</span>
        </div>
      </section>
    </main>
  </body>
</html>
